/* ============================================================
 * HANDLERS — event delegation
 * ============================================================ */
function attachHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    if (el.tagName === 'SELECT') {
      el.addEventListener('change', onFilterChange);
    } else {
      el.addEventListener('click', onAction);
    }
  });

  const obsInput = $('obs-input');
  if (obsInput) {
    obsInput.addEventListener('input', onObsInput);
    obsInput.addEventListener('blur', onObsBlur);
  }

  const newInd = $('new-indicator-input');
  if (newInd) {
    newInd.addEventListener('input', e => { state.indicatorEdit.draft = e.target.value; });
    setTimeout(() => newInd.focus(), 50);
  }
  const editInd = $('edit-indicator-input');
  if (editInd) {
    editInd.addEventListener('input', e => { state.indicatorEdit.draft = e.target.value; });
    setTimeout(() => { editInd.focus(); editInd.setSelectionRange(editInd.value.length, editInd.value.length); }, 50);
  }

  const areaForm = $('add-area-form');
  if (areaForm) areaForm.addEventListener('submit', onAddArea);
  const bimForm = $('add-bimester-form');
  if (bimForm) bimForm.addEventListener('submit', onAddBimester);

  const editArea = $('edit-area-input');
  if (editArea) {
    editArea.addEventListener('input', e => { state.areaEdit.draft = e.target.value; });
    setTimeout(() => { editArea.focus(); editArea.setSelectionRange(editArea.value.length, editArea.value.length); }, 50);
  }
  const editBim = $('edit-bimester-input');
  if (editBim) {
    editBim.addEventListener('input', e => { state.bimesterEdit.draft = e.target.value; });
    setTimeout(() => { editBim.focus(); editBim.setSelectionRange(editBim.value.length, editBim.value.length); }, 50);
  }
}

function onAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  const value = el.dataset.value;

  const handler = ACTIONS[action];
  if (handler) handler(value, el);
}

function onFilterChange(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  const value = el.value;
  if (action === 'filter-student')   state.filter.student = value;
  if (action === 'filter-indicador') state.filter.indicadorId = value;
  if (action === 'filter-area')      state.filter.area = value;
  if (action === 'filter-bimestre')  state.filter.bimestre = value;
  render();
}

/* Action handler map — kept compact so the dispatch above stays simple */
const ACTIONS = {
  back:               () => goBack(),
  'goto-home':        () => navigate('home'),
  'goto-summary':     () => showScreen('summary'),
  'continue-eval':    () => showScreen('evaluation'),

  'new-eval': () => {
    const missing = checkSetup();
    if (missing.length > 0) { showSetupGuard(missing); return; }
    const areas = DB.getAreas();
    const bims = DB.getBimesters();
    state.setup = {
      area: areas[0] || null,
      indicadorId: null,
      bimestre: currentBimestreLabel(bims),
    };
    showScreen('setup');
  },

  'open-history': () => {
    state.filter = { student: '', indicadorId: '', area: '', bimestre: '' };
    showScreen('history');
  },

  'open-students': () => {
    state.expandedStudent = null;
    showScreen('students');
  },

  'config-students':    () => showScreen('config-students'),
  'config-indicators':  () => {
    state.indicatorEdit = { editingId: null, adding: false, draft: '' };
    showScreen('config-indicators');
  },
  'config-areas':       () => showScreen('config-areas'),

  'set-area':       (v) => {
    if (state.setup.area !== v) state.setup.indicadorId = null;
    state.setup.area = v;
    render();
  },
  'set-bimestre':   (v) => { state.setup.bimestre = v; render(); },
  'set-indicador':  (v) => { state.setup.indicadorId = v; render(); },
  'start-eval':     () => startEvaluation(),

  'set-mode':  (v) => { state.evalMode = v; render(); },
  'set-val':   (v) => setValoracion(v),
  'set-nota':  (v) => setNota(parseInt(v, 10)),

  'prev-student': () => {
    if (state.studentIdx > 0) { state.studentIdx--; render(); }
  },
  'next-student': () => {
    if (state.studentIdx < state.currentEval.records.length - 1) {
      state.studentIdx++;
      render();
    } else {
      showScreen('summary');
    }
  },
  'toggle-obs': () => toggleObs(),

  'filter-clear': () => {
    state.filter = { student: '', indicadorId: '', area: '', bimestre: '' };
    render();
  },

  'open-eval': (_, el) => {
    const ev = DB.getEvaluation(el.dataset.id);
    if (ev) { state.currentEval = ev; showScreen('history-detail'); }
  },

  'delete-eval': () => {
    if (!confirm('¿Eliminar esta evaluación? No se puede deshacer.')) return;
    DB.deleteEvaluation(state.currentEval.id);
    toast('Evaluación eliminada');
    navigate('history');
  },

  'toggle-student': (v) => {
    state.expandedStudent = state.expandedStudent === v ? null : v;
    render();
  },

  'start-add': () => {
    const setupArea = state.setup && state.setup.area;
    state.indicatorEdit = { editingId: null, adding: true, draft: '', areaDraft: setupArea || DB.getAreas()[0] || null };
    render();
  },
  'cancel-add': () => {
    state.indicatorEdit = { editingId: null, adding: false, draft: '', areaDraft: null };
    render();
  },
  'save-add': () => {
    const text = (state.indicatorEdit.draft || '').trim();
    if (!text) { toast('Escribí el indicador'); return; }
    const area = state.indicatorEdit.areaDraft || DB.getAreas()[0];
    DB.addIndicator(text, area);
    state.indicatorEdit = { editingId: null, adding: false, draft: '', areaDraft: null };
    toast('Indicador creado');
    render();
  },
  'start-edit': (v) => {
    const ind = DB.getIndicators().find(i => i.id === v);
    state.indicatorEdit = { editingId: v, adding: false, draft: ind ? ind.text : '', areaDraft: ind ? ind.area : null };
    render();
  },
  'cancel-edit': () => {
    state.indicatorEdit = { editingId: null, adding: false, draft: '', areaDraft: null };
    render();
  },
  'save-edit': (v) => {
    const text = (state.indicatorEdit.draft || '').trim();
    if (!text) { toast('No puede quedar vacío'); return; }
    const area = state.indicatorEdit.areaDraft;
    DB.updateIndicator(v, text, area);
    state.indicatorEdit = { editingId: null, adding: false, draft: '', areaDraft: null };
    toast('Indicador actualizado');
    render();
  },
  'indicator-set-area': (v) => {
    state.indicatorEdit.areaDraft = v;
    render();
  },

  'start-area-edit': (v) => {
    state.areaEdit = { editingName: v, draft: v };
    render();
  },
  'cancel-area-edit': () => {
    state.areaEdit = { editingName: null, draft: '' };
    render();
  },
  'save-area-edit': (v) => {
    const next = (state.areaEdit.draft || '').trim();
    if (!next) { toast('No puede quedar vacío'); return; }
    const ok = DB.updateArea(v, next);
    if (!ok) { toast('Ese nombre ya existe'); return; }
    state.areaEdit = { editingName: null, draft: '' };
    toast('Área actualizada');
    render();
  },

  'start-bimester-edit': (v) => {
    state.bimesterEdit = { editingName: v, draft: v };
    render();
  },
  'cancel-bimester-edit': () => {
    state.bimesterEdit = { editingName: null, draft: '' };
    render();
  },
  'save-bimester-edit': (v) => {
    const next = (state.bimesterEdit.draft || '').trim();
    if (!next) { toast('No puede quedar vacío'); return; }
    const ok = DB.updateBimester(v, next);
    if (!ok) { toast('Ese nombre ya existe'); return; }
    state.bimesterEdit = { editingName: null, draft: '' };
    toast('Bimestre actualizado');
    render();
  },

  'remove-student': (v) => {
    showConfirm({
      title: `¿Quitar a "${v}"?`,
      text: 'Las evaluaciones anteriores se mantienen.',
      onConfirm: () => {
        const next = DB.getStudents().filter(s => s !== v);
        DB.saveStudents(next);
        toast('Alumno quitado');
        render();
      }
    });
  },

  'eval-another': () => {
    state.setup.indicadorId = null;
    state.currentEval = null;
    showScreen('setup');
  },
  'delete-indicator': (v) => {
    const ind = DB.getIndicators().find(i => i.id === v);
    const name = ind ? (ind.text.length > 60 ? ind.text.slice(0, 60) + '…' : ind.text) : 'este indicador';
    showConfirm({
      title: `¿Eliminar "${name}"?`,
      text: 'Las evaluaciones existentes mantendrán su texto histórico.',
      onConfirm: () => {
        DB.deleteIndicator(v);
        toast('Indicador eliminado');
        render();
      }
    });
  },

  'bulk-replace': () => bulkSaveStudents(true),
  'bulk-add':     () => bulkSaveStudents(false),
  'reset-students': () => {
    if (!confirm('¿Restaurar la lista de ejemplo? Se reemplazará tu lista actual.')) return;
    DB.saveStudents([...DEFAULTS.STUDENTS]);
    toast('Lista restaurada');
    render();
  },

  'delete-area': (v) => {
    if (DB.getAreas().length <= 1) { toast('Tiene que quedar al menos un área'); return; }
    showConfirm({
      title: `¿Eliminar "${v}"?`,
      onConfirm: () => {
        DB.deleteArea(v);
        toast('Área eliminada');
        render();
      }
    });
  },
  'delete-bimester': (v) => {
    if (DB.getBimesters().length <= 1) { toast('Tiene que quedar al menos un bimestre'); return; }
    showConfirm({
      title: `¿Eliminar "${v}"?`,
      onConfirm: () => {
        DB.deleteBimester(v);
        toast('Bimestre eliminado');
        render();
      }
    });
  },

  'export-csv': () => exportCSV(),

  'modal-cancel': () => { state.modal = null; render(); },
  'modal-confirm': () => {
    const m = state.modal;
    state.modal = null;
    if (m && m.onConfirm) m.onConfirm();
    else render();
  },
};

function checkSetup() {
  const missing = [];
  if (DB.getAreas().length === 0)      missing.push({ name: 'Áreas', screen: 'config-areas' });
  if (DB.getIndicators().length === 0) missing.push({ name: 'Indicadores', screen: 'config-indicators' });
  if (DB.getStudents().length === 0)   missing.push({ name: 'Alumnos', screen: 'config-students' });
  if (DB.getBimesters().length === 0)  missing.push({ name: 'Bimestres', screen: 'config-areas' });
  return missing;
}

function showSetupGuard(missing) {
  const names = missing.map(m => m.name).join(', ');
  const first = missing[0];
  state.modal = {
    title: 'Falta configurar',
    text: `Necesitás cargar: ${names} antes de evaluar.`,
    confirmLabel: `Ir a ${first.name}`,
    cancelLabel: 'Cancelar',
    danger: false,
    onConfirm: () => navigate(first.screen),
  };
  render();
}

/* ============================================================
 * BUSINESS LOGIC — evaluation actions
 * ============================================================ */
function startEvaluation() {
  const s = state.setup;
  if (!s.area || !s.indicadorId || !s.bimestre) return;
  const ind = DB.getIndicators().find(i => i.id === s.indicadorId);
  if (!ind) { toast('Indicador no encontrado'); return; }
  const students = DB.getStudents();
  if (students.length === 0) { toast('Cargá alumnos primero'); return; }
  const ev = DB.createEvaluation({
    area: s.area,
    bimestre: s.bimestre,
    indicadorId: ind.id,
    indicador: ind.text,
    students,
  });
  state.currentEval = ev;
  state.studentIdx = 0;
  state.evalMode = 'valoracion';
  showScreen('evaluation');
}

function setValoracion(val) {
  const ev = state.currentEval;
  const rec = ev.records[state.studentIdx];
  rec.valoracion = val;
  rec.nota = null;
  DB.updateRecord(ev.id, rec.alumno, { valoracion: val, nota: null });
  toast(`Guardado: ${VAL_MAP[val].label}`);
  render();
}

function setNota(n) {
  if (isNaN(n) || n < 1 || n > 10) return;
  const ev = state.currentEval;
  const rec = ev.records[state.studentIdx];
  rec.nota = n;
  rec.valoracion = notaToValoracion(n);
  DB.updateRecord(ev.id, rec.alumno, { nota: n, valoracion: rec.valoracion });
  toast(`Nota: ${n}`);
  render();
}

function toggleObs() {
  const toggle = document.querySelector('.obs-toggle');
  const body = $('obs-body');
  toggle.classList.toggle('open');
  body.classList.toggle('open');
  if (body.classList.contains('open')) {
    setTimeout(() => $('obs-input')?.focus(), 200);
  }
}

let obsTimer = null;
function onObsInput(e) {
  const ev = state.currentEval;
  const rec = ev.records[state.studentIdx];
  rec.observacion = e.target.value;
  clearTimeout(obsTimer);
  obsTimer = setTimeout(() => DB.updateRecord(ev.id, rec.alumno, { observacion: rec.observacion }), 400);
}

function onObsBlur() {
  const ev = state.currentEval;
  const rec = ev.records[state.studentIdx];
  DB.updateRecord(ev.id, rec.alumno, { observacion: rec.observacion });
}

/* ============================================================
 * BUSINESS LOGIC — students bulk
 * ============================================================ */
function parseStudentList(text) {
  return text.split(/[\n\r]+/).map(s => s.trim()).filter(s => s.length > 0);
}

function bulkSaveStudents(replace) {
  const input = $('bulk-input');
  if (!input) return;
  const parsed = parseStudentList(input.value);
  if (parsed.length === 0) { toast('Pegá al menos un nombre'); return; }
  const current = DB.getStudents();
  if (replace) {
    if (!confirm(`¿Reemplazar con ${parsed.length} ${parsed.length === 1 ? 'alumno' : 'alumnos'}? Las evaluaciones anteriores se mantienen.`)) return;
    DB.saveStudents(parsed);
    toast(`Lista reemplazada (${parsed.length})`);
  } else {
    const merged = [...current];
    let added = 0;
    parsed.forEach(name => { if (!merged.includes(name)) { merged.push(name); added++; } });
    if (added === 0) { toast('Ya estaban todos en la lista'); return; }
    DB.saveStudents(merged);
    toast(`${added} ${added === 1 ? 'alumno agregado' : 'alumnos agregados'}`);
  }
  render();
}

/* ============================================================
 * BUSINESS LOGIC — areas/bimesters add forms
 * ============================================================ */
function onAddArea(e) {
  e.preventDefault();
  const input = $('new-area-input');
  if (!input) return;
  const v = input.value.trim();
  if (!v) { toast('Escribí un nombre'); return; }
  if (!DB.addArea(v)) { toast('Esa área ya existe'); return; }
  toast('Área agregada');
  render();
}

function onAddBimester(e) {
  e.preventDefault();
  const input = $('new-bimester-input');
  if (!input) return;
  const v = input.value.trim();
  if (!v) { toast('Escribí un nombre'); return; }
  if (!DB.addBimester(v)) { toast('Ese bimestre ya existe'); return; }
  toast('Bimestre agregado');
  render();
}

/* ============================================================
 * CSV EXPORT
 * ============================================================ */
function csvEscape(val) {
  if (val == null) return '';
  const s = String(val);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const evals = DB.getEvaluations();
  const f = state.filter;
  const filtered = evals.filter(ev => {
    if (f.area && ev.area !== f.area) return false;
    if (f.bimestre && ev.bimestre !== f.bimestre) return false;
    if (f.indicadorId && ev.indicadorId !== f.indicadorId) return false;
    return true;
  });

  const rows = [];
  filtered.forEach(ev => {
    ev.records.forEach(rec => {
      if (!rec.valoracion) return;
      if (f.student && rec.alumno !== f.student) return;
      rows.push([
        rec.alumno,
        ev.area || '',
        ev.indicador || '',
        ev.bimestre || '',
        VAL_MAP[rec.valoracion]?.label || rec.valoracion,
        rec.nota != null ? rec.nota : '',
        rec.observacion || '',
        formatDate(ev.date)
      ]);
    });
  });

  if (rows.length === 0) { toast('Sin datos para exportar'); return; }

  rows.sort((a, b) => a[0].localeCompare(b[0], 'es'));
  const header = ['Alumno','Área','Indicador','Bimestre','Valoración','Nota','Observación','Fecha'];
  const csv = '﻿' + [header, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `evaluar_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Exportado: ${rows.length} filas`);
}

/* ============================================================
 * ONBOARDING
 * ============================================================ */
const ONBOARDING_KEY = 'onboarding_done';

function showOnboardingIfNeeded() {
  if (localStorage.getItem(ONBOARDING_KEY)) return;
  const overlay = $('onboarding');
  const closeBtn = $('onboarding-close');
  if (!overlay || !closeBtn) return;
  overlay.hidden = false;
  closeBtn.addEventListener('click', () => {
    localStorage.setItem(ONBOARDING_KEY, '1');
    overlay.hidden = true;
  }, { once: true });
}

/* ============================================================
 * SWIPE NAVIGATION (evaluation screen)
 * ============================================================ */
let _touchStart = null;
function attachSwipeNav() {
  document.addEventListener('touchstart', (e) => {
    if (state.screen !== 'evaluation' || state.modal) return;
    if (e.touches.length !== 1) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
    const t = e.touches[0];
    _touchStart = { x: t.clientX, y: t.clientY, time: Date.now() };
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    const start = _touchStart;
    _touchStart = null;
    if (!start) return;
    if (state.screen !== 'evaluation' || state.modal) return;
    if (e.changedTouches.length !== 1) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - start.x;
    const dy = t.clientY - start.y;
    const dt = Date.now() - start.time;
    if (dt > 600) return;
    if (Math.abs(dx) < 60) return;
    if (Math.abs(dy) > Math.abs(dx) * 0.6) return;
    if (dx < 0) {
      ACTIONS['next-student'] && ACTIONS['next-student']();
    } else {
      ACTIONS['prev-student'] && ACTIONS['prev-student']();
    }
  }, { passive: true });
}

/* ============================================================
 * INIT
 * ============================================================ */
function init() {
  DB.load();
  state.screen = 'home';
  attachSwipeNav();
  render();
  showOnboardingIfNeeded();
}

init();
