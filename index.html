<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#faf8f5">
<title>Evaluar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --surface-alt: #f5f1ea;
    --border: #e8e2d6;
    --text: #1c1917;
    --text-soft: #57534e;
    --text-mute: #a8a29e;
    --accent: #7c3aed;
    --accent-soft: #ede9fe;
    --logrado: #10b981;
    --proceso: #f59e0b;
    --apoyo: #ef4444;
    --noeval: #9ca3af;
    --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.04);
    --shadow: 0 4px 16px rgba(28, 25, 23, 0.06);
    --shadow-lg: 0 12px 32px rgba(28, 25, 23, 0.08);
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  body { min-height: 100vh; min-height: 100dvh; }
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
  button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, textarea:focus, button:focus { outline: none; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .screen { display: flex; flex-direction: column; flex: 1; padding: 24px 20px 32px; animation: fadeIn .25s ease; }
  .screen.slide-in-right { animation: slideInRight .28s ease; }
  .screen.slide-in-left { animation: slideInLeft .28s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideInRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideInLeft { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 24px; min-height: 56px; }
  .topbar .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); font-weight: 500; font-size: 15px; padding: 8px 10px 8px 4px; border-radius: 10px; min-height: 44px; }
  .topbar .back:active { background: var(--surface-alt); }
  .topbar .title { font-size: 15px; font-weight: 600; color: var(--text-soft); }
  .topbar .spacer { width: 60px; }

  .h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 8px; }
  .h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; margin-bottom: 6px; }
  .h3 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .lead { color: var(--text-soft); font-size: 15px; margin-bottom: 24px; }
  .muted { color: var(--text-mute); font-size: 14px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 12px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 14px; font-weight: 600; min-height: 52px; transition: transform .08s ease, background .15s ease, box-shadow .15s ease; width: 100%; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--text); color: white; box-shadow: var(--shadow); }
  .btn-primary:active { background: #0a0908; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:active { background: var(--surface-alt); }
  .btn-ghost { background: transparent; color: var(--text-soft); }
  .btn-ghost:active { background: var(--surface-alt); }
  .btn-lg { font-size: 17px; min-height: 60px; padding: 18px; border-radius: 16px; }
  .btn[disabled] { opacity: 0.5; pointer-events: none; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--text-soft); }
  .input { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 16px; width: 100%; min-height: 52px; transition: border-color .15s ease; }
  .input:focus { border-color: var(--text); }
  .input.center { text-align: center; letter-spacing: 0.5em; font-size: 22px; font-weight: 600; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; min-height: 60px; transition: background .12s ease, border-color .12s ease; text-align: left; width: 100%; }
  .list-item:active { background: var(--surface-alt); }
  .list-item.active { border-color: var(--text); background: var(--text); color: white; }
  .list-item .arrow { color: var(--text-mute); font-size: 18px; }
  .list-item.active .arrow { color: rgba(255,255,255,0.7); }
  .list-item-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .list-item-title { font-weight: 600; font-size: 15px; }
  .list-item-meta { font-size: 13px; color: var(--text-mute); }
  .list-item.active .list-item-meta { color: rgba(255,255,255,0.7); }

  .home-hero { padding: 32px 4px 28px; }
  .home-hero .greeting { color: var(--text-soft); font-size: 15px; margin-bottom: 4px; }
  .home-cta { margin-bottom: 14px; }
  .home-cta .btn-primary { padding: 24px; min-height: 88px; font-size: 19px; border-radius: 20px; flex-direction: column; gap: 4px; align-items: flex-start; }
  .home-cta .btn-primary .sub { font-size: 13px; font-weight: 400; opacity: 0.7; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .stat-value { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-label { font-size: 12px; color: var(--text-mute); margin-top: 2px; font-weight: 500; }

  .progress-wrap { padding: 4px 0 18px; }
  .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--text-soft); font-weight: 500; }
  .progress-bar { height: 6px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--text); border-radius: 3px; transition: width .3s ease; }

  .student-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; margin-bottom: 20px; }
  .student-name { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .student-meta { font-size: 13px; color: var(--text-mute); margin-top: 6px; font-weight: 500; }

  .valoracion-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .val-btn { display: flex; align-items: center; gap: 14px; padding: 18px 18px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--border); min-height: 60px; text-align: left; transition: transform .08s ease, background .15s ease, border-color .15s ease; font-weight: 600; font-size: 16px; }
  .val-btn:active { transform: scale(0.985); }
  .val-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
  .val-btn[data-val="logrado"] .val-dot { background: var(--logrado); }
  .val-btn[data-val="proceso"] .val-dot { background: var(--proceso); }
  .val-btn[data-val="apoyo"] .val-dot { background: var(--apoyo); }
  .val-btn[data-val="noeval"] .val-dot { background: var(--noeval); }
  .val-btn.selected[data-val="logrado"] { background: var(--logrado); border-color: var(--logrado); color: white; }
  .val-btn.selected[data-val="proceso"] { background: var(--proceso); border-color: var(--proceso); color: white; }
  .val-btn.selected[data-val="apoyo"] { background: var(--apoyo); border-color: var(--apoyo); color: white; }
  .val-btn.selected[data-val="noeval"] { background: var(--noeval); border-color: var(--noeval); color: white; }
  .val-btn.selected .val-dot { background: white; }

  .obs-section { margin-top: 4px; margin-bottom: 18px; }
  .obs-toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; font-weight: 500; color: var(--text-soft); font-size: 14px; min-height: 48px; }
  .obs-toggle:active { background: var(--surface-alt); }
  .obs-toggle.has-content { color: var(--text); }
  .obs-toggle .chev { transition: transform .2s ease; font-size: 12px; color: var(--text-mute); }
  .obs-toggle.open .chev { transform: rotate(180deg); }
  .obs-body { max-height: 0; overflow: hidden; transition: max-height .25s ease, margin-top .25s ease; }
  .obs-body.open { max-height: 240px; margin-top: 10px; }
  textarea.input { resize: none; min-height: 100px; line-height: 1.5; }

  .nav-row { display: flex; gap: 10px; margin-top: auto; padding-top: 16px; }
  .nav-row .btn { flex: 1; }

  .indicator-pill { display: inline-block; padding: 6px 12px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }

  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }

  .distribution { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .distribution h3 { margin-bottom: 14px; }
  .dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dist-row:last-child { margin-bottom: 0; }
  .dist-label { display: flex; align-items: center; gap: 8px; min-width: 130px; font-size: 14px; font-weight: 500; }
  .dist-label .val-dot { width: 12px; height: 12px; }
  .dist-bar-track { flex: 1; height: 8px; background: var(--surface-alt); border-radius: 4px; overflow: hidden; }
  .dist-bar-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
  .dist-bar-fill.logrado { background: var(--logrado); }
  .dist-bar-fill.proceso { background: var(--proceso); }
  .dist-bar-fill.apoyo { background: var(--apoyo); }
  .dist-bar-fill.noeval { background: var(--noeval); }
  .dist-count { font-size: 14px; font-weight: 600; min-width: 24px; text-align: right; }

  .obs-list { display: flex; flex-direction: column; gap: 10px; }
  .obs-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .obs-item-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .obs-item-text { font-size: 14px; color: var(--text-soft); line-height: 1.45; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip { padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-soft); white-space: nowrap; flex-shrink: 0; min-height: 40px; }
  .filter-chip:active { background: var(--surface-alt); }
  .filter-chip.active { background: var(--text); color: white; border-color: var(--text); }

  .empty { text-align: center; padding: 48px 20px; color: var(--text-mute); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--text-soft); margin-bottom: 4px; }
  .empty-text { font-size: 13px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: white; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 100; box-shadow: var(--shadow-lg); white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .loading { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--text-mute); }
  .spinner { width: 22px; height: 22px; border: 2.5px solid var(--surface-alt); border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .indicator-list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 280px); max-height: calc(100dvh - 280px); overflow-y: auto; padding: 2px; -webkit-overflow-scrolling: touch; }
  .indicator-list::-webkit-scrollbar { width: 4px; }
  .indicator-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .indicator-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: left; transition: background .12s ease, border-color .12s ease; min-height: 56px; display: flex; align-items: center; gap: 12px; }
  .indicator-item:active { background: var(--surface-alt); }
  .indicator-item.selected { border-color: var(--text); background: var(--text); color: white; }
  .indicator-num { font-size: 12px; font-weight: 700; color: var(--text-mute); min-width: 22px; }
  .indicator-item.selected .indicator-num { color: rgba(255,255,255,0.7); }
  .indicator-text { font-size: 14px; font-weight: 500; line-height: 1.35; }

  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: left; width: 100%; transition: background .12s ease; }
  .history-item:active { background: var(--surface-alt); }
  .history-date { font-size: 12px; color: var(--text-mute); font-weight: 500; margin-bottom: 4px; }
  .history-indicator { font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 8px; }
  .history-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-soft); }
  .history-stat { display: inline-flex; align-items: center; gap: 4px; }
  .history-stat .val-dot { width: 8px; height: 8px; }

  /* Indicator management */
  .manage-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; }
  .manage-item .indicator-num { padding-top: 2px; }
  .manage-text { flex: 1; font-size: 14px; line-height: 1.4; min-width: 0; word-wrap: break-word; }
  .manage-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-alt); color: var(--text-soft); font-size: 15px; transition: background .12s ease, color .12s ease; }
  .icon-btn:active { background: var(--border); }
  .icon-btn.danger { color: var(--apoyo); }
  .icon-btn.danger:active { background: #fee2e2; }
  .manage-edit { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
  .manage-edit-actions { display: flex; gap: 8px; }
  .manage-edit-actions .btn { min-height: 44px; padding: 10px 14px; font-size: 14px; }
  .add-indicator-card { background: var(--accent-soft); border: 1.5px dashed var(--accent); border-radius: 14px; padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .add-indicator-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); border: 1.5px dashed var(--border); border-radius: 14px; padding: 16px; color: var(--accent); font-weight: 600; font-size: 15px; width: 100%; min-height: 56px; margin-bottom: 14px; transition: background .12s ease, border-color .12s ease; }
  .add-indicator-btn:active { background: var(--accent-soft); border-color: var(--accent); }
  .add-indicator-btn .plus { font-size: 18px; font-weight: 700; }

  /* Students view */
  .students-list { display: flex; flex-direction: column; gap: 10px; }
  .student-row { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .student-row-head { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; transition: background .12s ease; }
  .student-row-head:active { background: var(--surface-alt); }
  .student-row.expanded .student-row-head { background: var(--surface-alt); border-bottom: 1px solid var(--border); }
  .student-row-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .student-row-name .chev { color: var(--text-mute); font-size: 12px; transition: transform .2s ease; }
  .student-row.expanded .student-row-name .chev { transform: rotate(180deg); }
  .dot-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--noeval); position: relative; }
  .dot.logrado { background: var(--logrado); }
  .dot.proceso { background: var(--proceso); }
  .dot.apoyo { background: var(--apoyo); }
  .dot.noeval { background: var(--noeval); }
  .dot.empty { background: var(--border); }
  .student-detail { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .student-detail-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--surface-alt); }
  .student-detail-row:last-child { border-bottom: none; }
  .student-detail-row .val-dot { width: 10px; height: 10px; margin-top: 6px; flex-shrink: 0; }
  .student-detail-row .val-dot.logrado { background: var(--logrado); }
  .student-detail-row .val-dot.proceso { background: var(--proceso); }
  .student-detail-row .val-dot.apoyo { background: var(--apoyo); }
  .student-detail-row .val-dot.noeval { background: var(--noeval); }
  .student-detail-row .val-dot.empty { background: var(--border); }
  .student-detail-body { flex: 1; min-width: 0; }
  .student-detail-ind { font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 2px; }
  .student-detail-meta { font-size: 12px; color: var(--text-mute); }
  .student-detail-obs { font-size: 13px; color: var(--text-soft); line-height: 1.4; margin-top: 4px; padding: 8px 10px; background: var(--surface-alt); border-radius: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; font-size: 12px; color: var(--text-soft); }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-item .dot { width: 9px; height: 9px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar .btn { flex: 1; min-height: 44px; padding: 10px 14px; font-size: 14px; }

  /* Bulk student import / management */
  .student-edit-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .student-edit-item .input { flex: 1; min-height: 48px; padding: 12px 14px; font-size: 15px; }
  .single-add-row { display: flex; gap: 8px; }
  .single-add-row .input { flex: 1; }
  .single-add-row .btn { width: auto; min-width: 56px; padding: 0 18px; }
  .section-head { font-size: 12px; font-weight: 600; color: var(--text-soft); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .help-text { font-size: 13px; color: var(--text-soft); line-height: 1.45; margin-bottom: 12px; }

  @media (max-width: 360px) {
    .h1 { font-size: 26px; }
    .student-name { font-size: 24px; }
    .screen { padding: 20px 16px 28px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * CONFIG
 * ============================================================ */
const CONFIG = {
  STORAGE_KEY: 'evaluar_v1',
  STUDENTS_KEY: 'evaluar_students_v1',
};

const DEFAULT_STUDENTS = [
  'Sofía Martínez', 'Tomás García', 'Valentina López', 'Mateo Rodríguez',
  'Camila Fernández', 'Santiago Pérez', 'Isabella González', 'Benjamín Díaz',
  'Lucía Torres', 'Joaquín Ramírez'
];

function loadStudents() {
  try {
    const raw = localStorage.getItem(CONFIG.STUDENTS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.filter(s => typeof s === 'string' && s.trim()).map(s => s.trim());
    }
  } catch (e) {}
  return [...DEFAULT_STUDENTS];
}

function saveStudents(arr) {
  STUDENTS.length = 0;
  STUDENTS.push(...arr);
  localStorage.setItem(CONFIG.STUDENTS_KEY, JSON.stringify(STUDENTS));
}

function parseStudentList(text) {
  return text.split(/[\n\r]+/).map(s => s.trim()).filter(s => s.length > 0);
}

let STUDENTS = loadStudents();

const CURSOS = ['4° Grado'];
const AREAS = ['Lengua'];

const DEFAULT_INDICATORS_TEXT = [
  'Lee textos narrativos con fluidez y entonación adecuada',
  'Comprende el sentido global de un texto leído',
  'Identifica personajes, lugar y tiempo en una narración',
  'Reconoce la estructura del texto narrativo (inicio, nudo, desenlace)',
  'Distingue entre texto literario y no literario',
  'Produce textos narrativos breves con coherencia',
  'Usa correctamente mayúsculas al inicio de oraciones y nombres propios',
  'Aplica reglas de acentuación en palabras agudas, graves y esdrújulas',
  'Reconoce sustantivos comunes y propios',
  'Identifica adjetivos calificativos en oraciones',
  'Conjuga verbos en presente, pasado y futuro',
  'Usa correctamente los signos de puntuación (punto, coma, signos de exclamación e interrogación)',
  'Construye oraciones con sujeto y predicado claros',
  'Amplía su vocabulario incorporando sinónimos y antónimos',
  'Expresa opiniones de forma oral con claridad',

/* ============================================================
 * UTILS
 * ============================================================ */
const $ = (id) => document.getElementById(id);
const $app = () => $('app');

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function formatDate(iso) {
  const d = new Date(iso);
  const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function formatDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}

function todayLabel() {
  const d = new Date();
  const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  return `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
}

function toast(msg, ms = 1800) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

/* ============================================================
 * DATA LAYER (localStorage)
 * ============================================================ */
const DB = {
  load() {
    let data;
    try {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
      data = raw ? JSON.parse(raw) : {};
    } catch (e) {
      data = {};
    }
    if (!Array.isArray(data.evaluations)) data.evaluations = [];
    if (!Array.isArray(data.indicators) || data.indicators.length === 0) {
      data.indicators = DEFAULT_INDICATORS_TEXT.map(text => ({ id: uid(), text }));
    }
    return data;
  },
  save(data) {
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
  },
  getEvaluations() {
    return this.load().evaluations || [];
  },
  getEvaluation(id) {
    return this.getEvaluations().find(e => e.id === id) || null;
  },
  getIndicators() {
    return this.load().indicators || [];
  },
  addIndicator(text) {
    const data = this.load();
    const ind = { id: uid(), text: text.trim() };
    data.indicators.push(ind);
    this.save(data);
    return ind;
  },
  updateIndicator(id, text) {
    const data = this.load();
    const ind = data.indicators.find(i => i.id === id);
    if (!ind) return null;
    ind.text = text.trim();
    this.save(data);
    return ind;
  },
  deleteIndicator(id) {
    const data = this.load();
    data.indicators = data.indicators.filter(i => i.id !== id);
    this.save(data);
  },
  createEvaluation(meta) {
    const data = this.load();
    const evalu = {
      id: uid(),
      date: new Date().toISOString(),
      curso: meta.curso,
      area: meta.area,
      indicadorId: meta.indicadorId,
      indicador: meta.indicador,
      bimestre: meta.bimestre || currentBimestre(),
      records: STUDENTS.map(name => ({ alumno: name, valoracion: null, observacion: '' }))
    };
    data.evaluations.unshift(evalu);
    this.save(data);
    return evalu;
  },
  updateRecord(evalId, alumno, patch) {
    const data = this.load();
    const evalu = data.evaluations.find(e => e.id === evalId);
    if (!evalu) return null;
    const rec = evalu.records.find(r => r.alumno === alumno);
    if (!rec) return null;
    Object.assign(rec, patch);
    this.save(data);
    return rec;
  },
  fetchStudents() {
    return [...STUDENTS];
  },
  deleteEvaluation(id) {
    const data = this.load();
    data.evaluations = data.evaluations.filter(e => e.id !== id);
    this.save(data);
  }
};

function currentBimestre() {
  const m = new Date().getMonth();
  if (m <= 2) return '1°';
  if (m <= 5) return '2°';
  if (m <= 8) return '3°';
  return '4°';
}

function resolveIndicator(ev) {
  const indicators = DB.getIndicators();
  let ind = null;
  if (ev.indicadorId) {
    ind = indicators.find(i => i.id === ev.indicadorId);
  }
  if (!ind && ev.indicador) {
    ind = indicators.find(i => i.text === ev.indicador);
  }
  if (ind) {
    return { number: indicators.indexOf(ind) + 1, text: ind.text, id: ind.id, exists: true };
  }
  return { number: null, text: ev.indicador || '', id: null, exists: false };
}

function indNumLabel(ev) {
  const r = resolveIndicator(ev);
  return r.number != null ? `Ind. ${r.number}` : 'Ind. —';
}

  expandedStudent: null
};

/* ============================================================
 * ROUTER
 * ============================================================ */
function showScreen(name, payload, dir = 'right') {
  state.history.push(state.screen);
  state.screen = name;
  if (payload) Object.assign(state, payload);
  render(dir);
}

function goBack() {
  const prev = state.history.pop() || 'home';
  state.screen = prev;
  render('left');
}

function navigate(name, payload) {
  state.screen = name;
  if (payload) Object.assign(state, payload);
  state.history = [];
  render();
}

function render(dir) {
  const app = $app();
  let html = '';
  switch (state.screen) {
    case 'home': html = renderHome(); break;
    case 'setup': html = renderSetup(); break;
    case 'evaluation': html = renderEvaluation(); break;
    case 'summary': html = renderSummary(); break;
    case 'history': html = renderHistory(); break;
    case 'history-detail': html = renderHistoryDetail(); break;
    case 'manage-indicators': html = renderManageIndicators(); break;
    case 'students': html = renderStudents(); break;
    case 'manage-students': html = renderManageStudents(); break;
    default: html = renderHome();
  }
  const cls = dir === 'left' ? 'slide-in-left' : dir === 'right' ? 'slide-in-right' : '';
  app.innerHTML = `<div class="screen ${cls}">${html}</div>`;
  attachHandlers();
}

function renderSummary() {
  const ev = state.currentEval;
  if (!ev) { navigate('home'); return ''; }
  const total = ev.records.length;
  const evaluated = ev.records.filter(r => r.valoracion && r.valoracion !== 'noeval');
  const evaluatedCount = evaluated.length;
  const pending = total - ev.records.filter(r => r.valoracion).length;
  const counts = { logrado: 0, proceso: 0, apoyo: 0, noeval: 0 };
  ev.records.forEach(r => { if (r.valoracion) counts[r.valoracion]++; });
  const observations = ev.records.filter(r => r.observacion && r.observacion.trim());
  const indInfo = resolveIndicator(ev);

  return `
    ${renderTopbar({ back: true, title: 'Resumen', right: `<button class="btn-ghost" data-action="goto-home" style="font-size:13px;padding:8px;border-radius:8px;font-weight:600">Inicio</button>` })}

        return `

      <button class="btn btn-secondary" data-action="goto-home">Ir al inicio</button>
    </div>
  `;
}

function renderHistory() {
  const f = state.historyFilter;
  const all = DB.getEvaluations();
  const filtered = all.filter(ev => {
    if (f.type === 'all') return true;
    if (f.type === 'student') return ev.records.some(r => r.alumno === f.value && r.valoracion);
    if (f.type === 'indicador') return (ev.indicadorId && ev.indicadorId === f.value) || ev.indicador === f.value;
    return true;
  });

  const usedIndicatorIds = new Set();
  const indicatorChips = [];
  all.forEach(e => {
    const info = resolveIndicator(e);
    if (info.exists && info.id && !usedIndicatorIds.has(info.id)) {
      usedIndicatorIds.add(info.id);
      indicatorChips.push({ id: info.id, number: info.number });
    }
  });
  indicatorChips.sort((a, b) => a.number - b.number);

  return `
    ${renderTopbar({ back: true, title: 'Historial' })}
    <div class="h2" style="margin-bottom: 16px">Evaluaciones</div>

    <div style="font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em">Filtrar</div>
    <div class="filter-bar">
      <button class="filter-chip ${f.type === 'all' ? 'active' : ''}" data-action="filter-all">Todas</button>
      ${STUDENTS.map(s => `
        <button class="filter-chip ${f.type === 'student' && f.value === s ? 'active' : ''}" data-action="filter-student" data-value="${esc(s)}">${esc(s.split(' ')[0])}</button>
      `).join('')}
    </div>

    ${indicatorChips.length > 0 ? `
      <div style="font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:8px;margin-top:8px;text-transform:uppercase;letter-spacing:0.04em">Por indicador</div>
      <div class="filter-bar">
        ${indicatorChips.map(c => `<button class="filter-chip ${f.type === 'indicador' && f.value === c.id ? 'active' : ''}" data-action="filter-indicador" data-value="${esc(c.id)}">Ind. ${c.number}</button>`).join('')}
      </div>
    ` : ''}

    <div style="margin-top: 12px;">
      ${filtered.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">📋</div>
          <div class="empty-title">Sin evaluaciones</div>
          <div class="empty-text">${all.length === 0 ? 'Aún no registraste ninguna evaluación.' : 'No hay resultados con este filtro.'}</div>
        </div>
      ` : `
        <div class="list">
          ${filtered.map(ev => {
            const counts = { logrado: 0, proceso: 0, apoyo: 0, noeval: 0 };
            ev.records.forEach(r => { if (r.valoracion) counts[r.valoracion]++; });
            const info = resolveIndicator(ev);
            return `
              <button class="history-item" data-action="open-history" data-id="${esc(ev.id)}">
                <div class="history-date">${formatDate(ev.date)} · ${esc(ev.curso)} · ${esc(ev.area)} · ${esc(indNumLabel(ev))}</div>
                <div class="history-indicator">${esc(info.text)}</div>
                <div class="history-stats">
                  ${VALORACIONES.map(v => counts[v.id] > 0 ? `<span class="history-stat"><span class="val-dot" style="background:${v.color}"></span>${counts[v.id]}</span>` : '').join('')}
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

function renderHistoryDetail() {

  return `

    <p class="lead">Creá, editá o eliminá los indicadores que usás para evaluar.</p>

    ${editState.adding ? `
      <div class="add-indicator-card">
        <div style="font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.04em">Nuevo indicador</div>
        <textarea class="input" id="new-indicator-input" rows="3" placeholder="Escribí el indicador...">${esc(editState.draft)}</textarea>
        <div class="manage-edit-actions">
          <button class="btn btn-secondary" data-action="cancel-add">Cancelar</button>
          <button class="btn btn-primary" data-action="save-add">Guardar</button>
        </div>
      </div>
    ` : `
      <button class="add-indicator-btn" data-action="start-add">
        <span class="plus">+</span>
        <span>Nuevo indicador</span>
      </button>
    `}

    <div class="list">
      ${indicators.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">📋</div>
          <div class="empty-title">Sin indicadores</div>
          <div class="empty-text">Tocá "Nuevo indicador" para crear el primero.</div>
        </div>
      ` : indicators.map((ind, i) => {
        const isEditing = editState.editingId === ind.id;
        if (isEditing) {
          return `
            <div class="manage-item">
              <span class="indicator-num">${String(i + 1).padStart(2, '0')}</span>
              <div class="manage-edit">
                <textarea class="input" id="edit-indicator-input" rows="3">${esc(editState.draft)}</textarea>
                <div class="manage-edit-actions">
                  <button class="btn btn-secondary" data-action="cancel-edit">Cancelar</button>
                  <button class="btn btn-primary" data-action="save-edit" data-value="${esc(ind.id)}">Guardar</button>
                </div>
              </div>
            </div>
          `;
        }
        return `
          <div class="manage-item">
            <span class="indicator-num">${String(i + 1).padStart(2, '0')}</span>
            <div class="manage-text">${esc(ind.text)}</div>
            <div class="manage-actions">
              <button class="icon-btn" data-action="start-edit" data-value="${esc(ind.id)}" aria-label="Editar">✎</button>
              <button class="icon-btn danger" data-action="delete-indicator" data-value="${esc(ind.id)}" aria-label="Eliminar">×</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderStudents() {
  const indicators = DB.getIndicators();
  const allEvals = DB.getEvaluations();
  const evalsByIndId = {};
  allEvals.forEach(ev => {
    const info = resolveIndicator(ev);
    const key = info.exists ? info.id : `__missing__${ev.indicador || ev.id}`;
    if (!evalsByIndId[key]) evalsByIndId[key] = [];
    evalsByIndId[key].push(ev);
  });
  Object.values(evalsByIndId).forEach(arr => arr.sort((a, b) => new Date(b.date) - new Date(a.date)));

  function latestForStudent(student, indId) {
    const arr = evalsByIndId[indId] || [];
    for (const ev of arr) {
      const rec = ev.records.find(r => r.alumno === student);
      if (rec && rec.valoracion) {
        return { val: rec.valoracion, date: ev.date, obs: rec.observacion };
      }
    }
    return null;
  }

  return `
    ${renderTopbar({
      back: true,
      title: 'Alumnos',
      right: `<button class="btn-ghost" data-action="export-csv" style="font-size:13px;padding:8px;border-radius:8px;font-weight:600">Exportar</button>`
    })}
    <div class="h2" style="margin-bottom: 6px">Alumnos</div>
    <p class="lead">Última valoración por indicador.</p>

    <div class="toolbar">
      <button class="btn btn-secondary" data-action="export-csv">⬇ Exportar CSV</button>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="dot logrado"></span>Logrado</span>
      <span class="legend-item"><span class="dot proceso"></span>En proceso</span>
      <span class="legend-item"><span class="dot apoyo"></span>Necesita apoyo</span>
      <span class="legend-item"><span class="dot empty"></span>Sin evaluar</span>
    </div>

    ${indicators.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">📋</div>
        <div class="empty-title">Sin indicadores</div>
        <div class="empty-text">Creá indicadores para empezar a evaluar.</div>
      </div>
    ` : `
      <div class="students-list">
        ${STUDENTS.map(student => {
          const expanded = state.expandedStudent === student;
          const cells = indicators.map(ind => {
            const last = latestForStudent(student, ind.id);
            return { ind, last };
          });
          return `
            <div class="student-row ${expanded ? 'expanded' : ''}">
              <button class="student-row-head" data-action="toggle-student" data-value="${esc(student)}">
                <div class="student-row-name">
                  <span>${esc(student)}</span>
                  <span class="chev">▼</span>
                </div>
                <div class="dot-row">
                  ${cells.map(c => `<span class="dot ${c.last ? c.last.val : 'empty'}" title="${esc(c.ind.text)}${c.last ? ' — ' + esc(VAL_MAP[c.last.val].label) : ''}"></span>`).join('')}
                </div>
              </button>
              ${expanded ? `
                <div class="student-detail">
                  ${cells.map((c, i) => `
                    <div class="student-detail-row">
                      <span class="val-dot ${c.last ? c.last.val : 'empty'}"></span>
                      <div class="student-detail-body">
                        <div class="student-detail-ind">${String(i + 1).padStart(2, '0')}. ${esc(c.ind.text)}</div>
                        <div class="student-detail-meta">${c.last ? `${esc(VAL_MAP[c.last.val].label)} · ${formatDateShort(c.last.date)}` : 'Sin evaluar'}</div>
                        ${c.last && c.last.obs && c.last.obs.trim() ? `<div class="student-detail-obs">${esc(c.last.obs)}</div>` : ''}
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;
}

function renderManageStudents() {
  return `
    ${renderTopbar({ back: true, title: 'Cargar alumnos' })}
    <div style="margin-bottom: 20px;">
      <div class="h2">Alumnos</div>
      <p class="lead" style="margin-bottom:0">${STUDENTS.length} ${STUDENTS.length === 1 ? 'alumno' : 'alumnos'} en tu lista</p>
    </div>

    <div class="card" style="margin-bottom: 14px;">
      <div class="section-head">Carga masiva</div>
      <p class="help-text">Pegá una lista de alumnos, uno por línea (Nombre Apellido).</p>
      <textarea class="input" id="bulk-input" rows="6" placeholder="Sofía Martínez&#10;Tomás García&#10;Valentina López..."></textarea>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
        <button class="btn btn-primary" data-action="bulk-replace">Guardar lista (reemplazar)</button>
        <button class="btn btn-secondary" data-action="bulk-add">Agregar a la lista</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: 18px;">
      <div class="section-head">Agregar uno</div>
      <form id="single-add-form" class="single-add-row" novalidate>
        <input class="input" id="single-input" placeholder="Nombre Apellido" autocomplete="off">
        <button type="submit" class="btn btn-primary">+</button>
      </form>
    </div>

    <div class="section-head">Lista actual</div>
    ${STUDENTS.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">👤</div>
        <div class="empty-title">Sin alumnos</div>
        <div class="empty-text">Agregá alumnos para empezar a evaluar.</div>
      </div>
    ` : `
      <div style="margin-bottom: 8px;">
        ${STUDENTS.map((s, i) => `
          <div class="student-edit-item">
            <input class="input student-name-input" data-idx="${i}" value="${esc(s)}" aria-label="Nombre del alumno ${i + 1}">
            <button class="icon-btn danger" data-action="delete-student" data-idx="${i}" aria-label="Eliminar">×</button>
          </div>
        `).join('')}
      </div>
    `}

    <button class="btn btn-ghost" data-action="reset-students" style="margin-top: 16px; font-size: 13px;">Restaurar lista de ejemplo</button>
  `;
}

/* ============================================================
 * EVENT HANDLERS
 * ============================================================ */
function attachHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });

  const obsInput = $('obs-input');
  if (obsInput) {
    obsInput.addEventListener('input', onObsInput);
    obsInput.addEventListener('blur', onObsBlur);
  }

  const newInd = $('new-indicator-input');
  if (newInd) {
    newInd.addEventListener('input', e => { state.indicatorEdit.draft = e.target.value; });
    setTimeout(() => newInd.focus(), 60);
  }
  const editInd = $('edit-indicator-input');
  if (editInd) {
    editInd.addEventListener('input', e => { state.indicatorEdit.draft = e.target.value; });
    setTimeout(() => { editInd.focus(); editInd.setSelectionRange(editInd.value.length, editInd.value.length); }, 60);
  }

  document.querySelectorAll('.student-name-input').forEach(el => {
    el.addEventListener('blur', onStudentNameBlur);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });

  const singleForm = $('single-add-form');
  if (singleForm) singleForm.addEventListener('submit', onAddSingle);
}

function onAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  const value = el.dataset.value;

  switch (action) {
    case 'back': return goBack();
    case 'new-eval':
      state.setup = { curso: CURSOS[0], area: AREAS[0], indicadorId: null };
      showScreen('setup');
      return;
    case 'history':
      state.historyFilter = { type: 'all', value: null };
      showScreen('history');
      return;
    case 'students':
      state.expandedStudent = null;
      showScreen('students');
      return;
    case 'manage-indicators':
      state.indicatorEdit = { editingId: null, adding: false, draft: '' };
      showScreen('manage-indicators');
      return;
    case 'set-curso': state.setup.curso = value; render(); return;
    case 'set-area': state.setup.area = value; render(); return;
    case 'set-indicador':
      state.setup.indicadorId = value;
      render();
      return;
    case 'start-eval': return startEvaluation();
    case 'set-val': return setValoracion(value);
    case 'prev-student':
      if (state.studentIdx > 0) {
        state.studentIdx--;
        render('left');
      }
      return;
    case 'next-student':
      if (state.studentIdx < state.currentEval.records.length - 1) {
        state.studentIdx++;
        render('right');
      } else {
        showScreen('summary');
      }
      return;
    case 'toggle-obs': return toggleObs();
    case 'finish-eval': return showScreen('summary');
    case 'continue-eval': return showScreen('evaluation');
    case 'goto-home': return navigate('home');
    case 'filter-all':
      state.historyFilter = { type: 'all', value: null };
      render();
      return;
    case 'filter-student':
      state.historyFilter = { type: 'student', value };
      render();
      return;
    case 'filter-indicador':
      state.historyFilter = { type: 'indicador', value };
      render();
      return;
    case 'open-history':
      const ev = DB.getEvaluation(el.dataset.id);
      if (ev) {
        state.currentEval = ev;
        showScreen('history-detail');
      }
      return;
    case 'delete-eval':
      if (confirm('¿Eliminar esta evaluación? No se puede deshacer.')) {
        DB.deleteEvaluation(state.currentEval.id);
        toast('Evaluación eliminada');
        navigate('history');
      }
      return;
    case 'start-add':
      state.indicatorEdit = { editingId: null, adding: true, draft: '' };
      render();
      return;
    case 'cancel-add':
      state.indicatorEdit = { editingId: null, adding: false, draft: '' };
      render();
      return;
    case 'save-add': {
      const text = (state.indicatorEdit.draft || '').trim();
      if (!text) { toast('Escribí el indicador'); return; }
      DB.addIndicator(text);
      state.indicatorEdit = { editingId: null, adding: false, draft: '' };
      toast('Indicador creado');
      render();
      return;
    }
    case 'start-edit': {
      const ind = DB.getIndicators().find(i => i.id === value);
      state.indicatorEdit = { editingId: value, adding: false, draft: ind ? ind.text : '' };
      render();
      return;
    }
    case 'cancel-edit':
      state.indicatorEdit = { editingId: null, adding: false, draft: '' };
      render();
      return;
    case 'save-edit': {
      const text = (state.indicatorEdit.draft || '').trim();
      if (!text) { toast('El texto no puede quedar vacío'); return; }
      DB.updateIndicator(value, text);
      state.indicatorEdit = { editingId: null, adding: false, draft: '' };
      toast('Indicador actualizado');
      render();
      return;
    }
    case 'delete-indicator':
      if (confirm('¿Eliminar este indicador? Las evaluaciones existentes mantendrán su texto histórico.')) {
        DB.deleteIndicator(value);
        toast('Indicador eliminado');
        render();
      }
      return;
    case 'toggle-student':
      state.expandedStudent = state.expandedStudent === value ? null : value;
      render();
      return;
    case 'export-csv':
      return exportCSV();
    case 'manage-students':
      showScreen('manage-students');
      return;
    case 'bulk-replace':
      return bulkSaveStudents(true);
    case 'bulk-add':
      return bulkSaveStudents(false);
    case 'delete-student':
      return deleteStudent(parseInt(el.dataset.idx, 10));
    case 'reset-students':
      if (confirm('¿Restaurar la lista de alumnos de ejemplo? Se reemplazará tu lista actual.')) {
        saveStudents([...DEFAULT_STUDENTS]);
        toast('Lista restaurada');
        render();
      }
      return;
  }
}

function bulkSaveStudents(replace) {
  const input = $('bulk-input');
  if (!input) return;
  const parsed = parseStudentList(input.value);
  if (parsed.length === 0) {
    toast('Pegá al menos un nombre');
    return;
  }
  if (replace) {
    if (!confirm(`¿Reemplazar la lista actual con ${parsed.length} ${parsed.length === 1 ? 'alumno' : 'alumnos'}? Las evaluaciones anteriores se mantienen.`)) return;
    saveStudents(parsed);
    toast(`Lista reemplazada (${parsed.length})`);
  } else {
    const merged = [...STUDENTS];
    let added = 0;
    parsed.forEach(name => {
      if (!merged.includes(name)) { merged.push(name); added++; }
    });
    if (added === 0) {
      toast('Ya estaban todos en la lista');
      return;
    }
    saveStudents(merged);
    toast(`${added} ${added === 1 ? 'alumno agregado' : 'alumnos agregados'}`);
  }
  render();
}

function onAddSingle(e) {
  e.preventDefault();
  const input = $('single-input');
  if (!input) return;
  const name = input.value.trim();
  if (!name) { toast('Escribí un nombre'); return; }
  if (STUDENTS.includes(name)) { toast('Ese alumno ya está en la lista'); return; }
  saveStudents([...STUDENTS, name]);
  toast('Alumno agregado');
  render();
}

function deleteStudent(idx) {
  if (idx < 0 || idx >= STUDENTS.length) return;
  const name = STUDENTS[idx];
  if (!confirm(`¿Eliminar a ${name} de la lista? Las evaluaciones anteriores se mantienen.`)) return;
  const next = STUDENTS.filter((_, i) => i !== idx);
  saveStudents(next);
  toast('Alumno eliminado');
  render();
}

function onStudentNameBlur(e) {
  const el = e.currentTarget;
  const idx = parseInt(el.dataset.idx, 10);
  if (isNaN(idx) || idx < 0 || idx >= STUDENTS.length) return;
  const newName = el.value.trim();
  const oldName = STUDENTS[idx];
  if (!newName) {
    el.value = oldName;
    toast('El nombre no puede estar vacío');
    return;
  }
  if (newName === oldName) return;
  if (STUDENTS.some((s, i) => i !== idx && s === newName)) {
    el.value = oldName;
    toast('Ya existe un alumno con ese nombre');
    return;
  }
  const next = [...STUDENTS];
  next[idx] = newName;
  saveStudents(next);
  toast('Nombre actualizado');
}

function startEvaluation() {
  const s = state.setup;
  if (s.indicadorId == null) return;
  const ind = DB.getIndicators().find(i => i.id === s.indicadorId);
  if (!ind) { toast('Indicador no encontrado'); return; }
  const ev = DB.createEvaluation({
    curso: s.curso,
    area: s.area,
    indicadorId: ind.id,
    indicador: ind.text
  });
  state.currentEval = ev;
  state.studentIdx = 0;
  showScreen('evaluation');
}

function setValoracion(val) {
  const ev = state.currentEval;
  const rec = ev.records[state.studentIdx];
  rec.valoracion = val;
  DB.updateRecord(ev.id, rec.alumno, { valoracion: val });
  toast(`Guardado: ${VAL_MAP[val].label}`);
  document.querySelectorAll('.val-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.value === val);
  });
  const meta = document.querySelector('.student-meta');
  if (meta) meta.textContent = VAL_MAP[val].label;
  const completed = ev.records.filter(r => r.valoracion).length;
  const total = ev.records.length;
  const pct = Math.round((completed / total) * 100);
  const fill = document.querySelector('.progress-fill');
  if (fill) fill.style.width = pct + '%';
  const metaProg = document.querySelectorAll('.progress-meta span');
  if (metaProg[1]) metaProg[1].textContent = `${completed} evaluados`;
}

function toggleObs() {
  const toggle = document.querySelector('.obs-toggle');
  const body = $('obs-body');
  toggle.classList.toggle('open');
  body.classList.toggle('open');
  if (body.classList.contains('open')) {
    setTimeout(() => $('obs-input')?.focus(), 200);
  }
}

let obsTimer = null;
function onObsInput(e) {
  const ev = state.currentEval;
  const rec = ev.records[state.studentIdx];
  rec.observacion = e.target.value;
  clearTimeout(obsTimer);
  obsTimer = setTimeout(() => {
    DB.updateRecord(ev.id, rec.alumno, { observacion: rec.observacion });
  }, 400);
  const toggle = document.querySelector('.obs-toggle');
  if (toggle) {
    toggle.classList.toggle('has-content', !!rec.observacion);
    const span = toggle.querySelector('span:first-child');
    if (span) span.textContent = rec.observacion ? 'Observación' : 'Agregar observación';
  }
}

function onObsBlur() {
  const ev = state.currentEval;
  const rec = ev.records[state.studentIdx];
  DB.updateRecord(ev.id, rec.alumno, { observacion: rec.observacion });
}

/* ============================================================
 * CSV EXPORT
 * ============================================================ */
function csvEscape(val) {
  if (val == null) return '';
  const s = String(val);
  if (/[",\n\r]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportCSV() {
  const evals = DB.getEvaluations();
  const rows = [];
  evals.forEach(ev => {
    const info = resolveIndicator(ev);
    ev.records.forEach(rec => {
      if (!rec.valoracion) return;
      rows.push([
        rec.alumno,
        info.text,
        VAL_MAP[rec.valoracion]?.label || rec.valoracion,
        rec.observacion || '',
        formatDate(ev.date)
      ]);
    });
  });

  if (rows.length === 0) {
    toast('Sin datos para exportar');
    return;
  }

  rows.sort((a, b) => a[0].localeCompare(b[0], 'es'));

  const header = ['Alumno', 'Indicador', 'Valoración', 'Observación', 'Fecha'];
  const csvLines = [header, ...rows].map(r => r.map(csvEscape).join(','));
  const csv = '﻿' + csvLines.join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const fname = `evaluar_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.csv`;
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Exportado: ${rows.length} filas`);
}

/* ============================================================
 * INIT
 * ============================================================ */
function init() {
  state.screen = 'home';
  render();
}

init();
</script>
